# AudioMOS 系统配置文件
# 部署前请根据实际情况修改此配置文件
# ============================================================
# 环境变量覆盖（优先级高于config.yaml）:
#   AUDIOMOS_HOST          服务监听地址
#   AUDIOMOS_PORT          服务端口
#   AUDIOMOS_SECRET_KEY    JWT密钥(部署时必改)
#   AUDIOMOS_ADMIN_PASSWORD 管理员密码
#   AUDIOMOS_CORS_ORIGINS  CORS允许来源(逗号分隔,如 "https://a.com,https://b.com")
#   AUDIOMOS_REF_DIR       参考音频目录
#   AUDIOMOS_UPLOAD_DIR    上传目录
#   AUDIOMOS_RESULT_DIR    结果目录
#   AUDIOMOS_LOG_LEVEL     日志级别(DEBUG/INFO/WARNING/ERROR)
#   AUDIOMOS_CUDA_ENABLED  CUDA启用(true/false)
#   CUDA_VISIBLE_DEVICES   GPU设备ID
# ============================================================

# 服务器配置
server:
  # host 配置:
  #   - "0.0.0.0": 监听所有接口 (推荐，允许外部访问)
  #   - "auto": 自动检测并选择最佳IP (兼容性模式)
  #   - 具体IP如 "192.168.1.100": 监听指定IP
  #   - "127.0.0.1": 仅本地访问 (开发模式)
  host: "0.0.0.0"
  port: 8002
  debug: false

# 安全认证配置
auth:
  # JWT密钥,部署时请务必修改
  # 生成方法(任选其一):
  #   1. OpenSSL: openssl rand -hex 32
  #   2. Python:   python -c "import secrets; print(secrets.token_hex(32))"
  #   3. Linux:    head -c 32 /dev/urandom | xxd -p
  secret_key: "your-secret-key-change-this-in-production"
  # Token过期时间(分钟)
  access_token_expire_minutes: 60
  # 默认管理员账号
  admin_username: "admin"
  # 默认管理员密码(建议部署后立即修改)
  admin_password: "tp123456"

# 路径配置 - 所有数据统一存储在 data/ 目录下
paths:
  # 参考音频目录
  ref_dir: "./data/ref"
  # 上传文件存储目录
  upload_dir: "./data/uploads"
  # 结果文件存储目录
  result_dir: "./data/results"
  # 临时文件目录（切分、对齐等中间文件）
  temp_dir: "./data/temp"
  # 模型文件目录
  models_dir: "./models"

# CUDA配置
cuda:
  # 是否使用CUDA
  enabled: true
  # GPU设备ID
  device_id: 0

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # 日志文件路径(相对于项目根目录)
  # 前后端一体模式，日志输出到统一文件
  file: "./logs/unified.log"
  # 日志文件最大大小(MB)
  max_size: 10
  # 保留的日志文件数量
  backup_count: 5

# MOS评分权重配置(与原始代码保持一致)
scoring:
  weights:
    stoi: 5.0
    sisdr: 5.0
    pesq: 1.0
    dnsmos_ovrl: 1.0
    dnsmos_sig: 1.0
    dnsmos_bak: 1.0
    dnsmos_p808: 1.0
    wer: 5.0
    wcorr: 5.0
    nisqa_mos: 1.0
    nisqa_noi: 1.0
    nisqa_dis: 1.0
    nisqa_col: 1.0
    nisqa_loud: 1.0
    tcf: 5.0
    scoreq: 1.0

# 音频处理配置
audio:
  # 目标采样率
  target_sample_rate: 16000
  # 支持的音频格式
  supported_formats:
    - ".wav"
    - ".mp3"
  # 最大文件大小(MB)
  max_file_size: 100

# 参考音频内容匹配配置（基于Shazam算法的音频指纹匹配）
reference_matching:
  # 是否启用内容匹配（关闭后仅使用文件名匹配）
  enabled: true
  # 指纹提取参数
  fingerprint:
    # 采样率
    sr: 16000
    # STFT参数
    n_fft: 4096
    hop_length: 1024
    win_length: 4096
    # 峰值检测: 能量最小值(dB)
    amp_min: 5.0
    # 局部最大值区域范围
    neighborhood: 15
    # 锚点近邻个数
    near_num: 20
    # Hash时间间隔范围(frames)
    min_time_delta: 0
    max_time_delta: 200
  # 匹配参数
  matching:
    # 最少匹配Hash数（低于此值视为不匹配）
    min_hash_match: 5
    # 最低置信度阈值 (0-1)
    min_confidence: 0.3
  # DTW精确定位
  dtw:
    # 是否启用DTW精确定位
    enabled: true
    # DTW搜索范围扩展（秒），在指纹匹配位置前后各扩展
    search_margin: 5.0
    # MFCC参数
    n_mfcc: 13
    hop_length: 512
    n_fft: 2048

  # 低SNR匹配优化配置
  optimization:
    # 是否启用优化匹配（低SNR时自动启用预增强+自适应指纹+嵌入向量匹配）
    enabled: true
    # SNR阈值: 低于此值时启用预增强
    pre_enhance_snr_threshold: 10.0
    # SNR阈值: 低于此值时启用嵌入向量匹配（回退方案）
    embedding_snr_threshold: 5.0
    # 嵌入向量匹配: 滑动窗口时长（秒）
    embedding_window_duration: 12.0
    # 嵌入向量匹配: 滑动步长（秒）
    embedding_step_duration: 4.0
    # 预增强方法: wiener 或 spectral
    pre_enhance_method: "wiener"
    # HPSS谐波分离: 是否启用
    harmonic_separation: true
    # DTW增强: CMVN归一化+Delta特征+余弦距离
    robust_dtw: true
